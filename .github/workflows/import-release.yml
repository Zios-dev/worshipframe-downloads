name: Import desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Download private build artifacts
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --repo Zios-dev/lightshow --dir artifacts
      - name: Publish public download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo Zios-dev/worshipframe-downloads >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --repo Zios-dev/worshipframe-downloads --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --repo Zios-dev/worshipframe-downloads --target main --title "WorshipFrame $RELEASE_TAG" --notes "Verified macOS and Windows desktop installers. Bundled offline transcription resources are checked before publication." --latest
          fi
